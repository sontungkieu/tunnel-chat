<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT web · Tunnel Chat</title><link rel="stylesheet" href="/chat/viewer.css">
<script defer src="/chat/input-buffer.js"></script><script defer src="/chat/viewer.js"></script></head>
<body><header><b>ChatGPT web</b><span id="status" role="status">Đang kết nối…</span>
<span id="fps" title="Số khung hình thực sự vẽ mỗi giây; trang đứng yên sẽ ít khung hình hơn"></span><span id="latency" title="Thời gian khứ hồi tới máy cá nhân"></span><nav><button id="home">ChatGPT</button><button id="reload">Tải lại trang</button><button id="fit">Vừa cửa sổ</button>
<a href="/codex">Codex</a><a href="/chat/_auth/session">Đăng xuất</a></nav></header>
<div id="notice" role="alert" hidden></div>
<main id="stage"><canvas id="screen" role="img" aria-label="ChatGPT trên máy cá nhân" tabindex="0">ChatGPT trên máy cá nhân</canvas>
<p id="waiting">Đang chờ hình ảnh từ máy cá nhân…</p></main>
<footer><label for="text">Nhập hoặc dán văn bản</label><textarea id="text" rows="2" placeholder="Chọn ô trong trang rồi nhập văn bản tại đây…"></textarea>
<button id="insert">Chèn vào ô đang chọn</button><span>Click vào hình để dùng chuột, bàn phím và cuộn trang.</span></footer>
</body></html>
