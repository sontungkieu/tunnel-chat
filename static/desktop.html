<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tunnel Chat · Desktop</title><link rel="stylesheet" href="/static/desktop.css">
  <script defer src="/static/shared.js"></script><script defer src="/static/desktop.js"></script>
</head>
<body>
  <aside>
    <h1>Tunnel Chat</h1><p class="muted">Kết nối task trong app Windows</p>
    <nav><b>Desktop</b><a href="/codex">WSL CLI</a><a href="/">Fix queue</a></nav>
    <form id="linkForm">
      <label for="thread">Link hoặc ID task</label>
      <input id="thread" placeholder="codex://threads/…" required autocomplete="off">
      <button id="linkButton">Kết nối task</button>
    </form>
    <p class="muted small">Mở task trong app trước khi kết nối. Runtime, model và quyền thực thi theo thiết lập của task.</p>
    <div id="taskList" aria-label="Các task đã kết nối"></div>
    <button id="logout" class="secondary">Xóa token trên trình duyệt</button>
  </aside>
  <main>
    <header>
      <div><h2 id="title">Chọn một task</h2><div id="meta" class="muted"></div></div>
      <button id="reconnect" class="secondary">Kết nối lại</button>
    </header>
    <div id="notice" role="alert" hidden></div>
    <section id="messages" aria-label="Hội thoại">
      <p class="empty">Dán link task ở bên trái để tiếp tục làm việc từ trình duyệt.</p>
    </section>
    <section id="requests" aria-label="Yêu cầu chờ trả lời"></section>
    <form id="composer">
      <label for="prompt" class="sr-only">Tin nhắn</label>
      <textarea id="prompt" rows="4" placeholder="Gửi tin nhắn tới task… Ctrl+Enter để gửi"></textarea>
      <div id="filesLabel" class="muted small"></div>
      <footer>
        <label class="file-button">Đính kèm<input id="files" type="file" multiple></label>
        <select id="mode" aria-label="Cách gửi"><option value="start">Lượt mới</option><option value="steer">Chỉ dẫn cho lượt đang chạy</option></select>
        <span id="status" aria-live="polite">Chưa kết nối</span>
        <button type="button" id="stop" class="danger" disabled>Dừng lượt</button>
        <button id="send" disabled>Gửi</button>
      </footer>
    </form>
  </main>
</body>
</html>
